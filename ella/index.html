<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Newman School Tracker</title>
<noscript><meta http-equiv="refresh" content="0; url=../school/"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background: #F3F5F9; color: #111827; }
  a { color: #0E1B3A; font-weight: 700; }
</style>
</head>
<body>
<p>Ella's dashboard has moved to the <a href="../school/">Newman School Tracker</a>.</p>
<script>
// Ella's separate dashboard is retired. Remove its offline copy from this device, then open the School Tracker.
(function () {
  var done = false;
  function go() { if (!done) { done = true; location.replace("../school/"); } }
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.filter(function (r) { return /\/ella\/$/.test(new URL(r.scope).pathname); })
          .map(function (r) { return r.unregister(); }));
      }).then(go, go);
      setTimeout(go, 1500);
      return;
    }
  } catch (e) {}
  go();
})();
</script>
</body>
</html>
