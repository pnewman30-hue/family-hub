<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1B3A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ella School">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <title>Ella's Coach</title>
<style>
:root {
  --navy: #0E1B3A; --navy2: #122249; --panel: #070F24; --panel2: #101D3D; --line: #22335E;
  --muted: #C3CCE0; --dim: #8E9BBB; --gold: #F4C430; --gold-ink: #070F24; --white: #FFFFFF;
  --good: #7FE0A8; --mid: #FFB072; --bad: #FF8A80;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--navy); color: var(--white); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body { background: repeating-linear-gradient(90deg, var(--navy) 0, var(--navy) 120px, var(--navy2) 120px, var(--navy2) 240px); min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 18px 120px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { margin: 0; line-height: 1.12; }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.sub { color: var(--muted); font-size: 17px; }
.small { color: var(--dim); font-size: 14px; }
.panel { background: rgba(7, 15, 36, .82); border-radius: 18px; padding: 18px 20px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.pill { font-size: 12px; font-weight: 800; letter-spacing: .08em; padding: 5px 12px; border-radius: 999px; border: 2px solid var(--white); white-space: nowrap; }
.pill.solid { background: var(--white); color: var(--panel); }
.pill.gold { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.btn { border: 0; border-radius: 14px; padding: 15px 24px; font-size: 18px; font-weight: 800; min-height: 48px; }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: transparent; border: 2px solid var(--white); color: var(--white); }
.sec { font-size: 15px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }

/* header */
.top { display: flex; align-items: center; gap: 16px; }
.top h1 { font-size: 38px; font-weight: 800; letter-spacing: -.02em; }
.status { font-size: 13px; color: var(--dim); }

/* goal frame */
.goal { position: relative; padding: 12px 12px 0; }
.goal::before { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 48px; border: 9px solid var(--white); border-bottom: 0; border-radius: 4px 4px 0 0;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 1px, transparent 1px 20px), repeating-linear-gradient(-45deg, rgba(255,255,255,.10) 0 1px, transparent 1px 20px); }
.goal > .card { position: relative; margin: 22px 12px 0; }
.card { background: var(--panel); border-radius: 20px; overflow: hidden; }
.card .bar { display: flex; justify-content: space-between; gap: 10px; padding: 13px 22px; background: var(--gold); color: var(--gold-ink); font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.card .body { padding: 22px; display: grid; grid-template-columns: minmax(0,1fr) 150px; gap: 18px; align-items: center; }
.card .title { font-size: 32px; font-weight: 800; line-height: 1.1; }
.card .foot { padding: 0 22px 22px; }
.score { background: #000; border: 2px solid var(--line); border-radius: 14px; padding: 14px 0; text-align: center; }
.score b { display: block; font-size: 64px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.score span { font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--muted); }

/* bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(7,15,36,.96); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 4px; z-index: 5; }
nav.tabs button { background: transparent; border: 0; border-radius: 12px; padding: 8px 4px; min-height: 52px; font-size: 13px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav.tabs button[aria-current="page"] { background: var(--gold); color: var(--gold-ink); }
nav.tabs svg { width: 22px; height: 22px; }

/* game plan */
.buckets { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.bucket { text-align: left; border-radius: 16px; padding: 14px 16px; min-height: 92px; border: 2px solid var(--line); background: var(--panel2); }
.bucket[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.bucket .k { display: block; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.bucket .n { display: block; font-size: 23px; font-weight: 800; margin-top: 4px; }
.bucket .x { display: block; font-size: 13px; font-weight: 600; margin-top: 3px; opacity: .85; }
.picker { display: flex; gap: 8px; flex-wrap: wrap; }
.picker button { border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 9px 14px; font-size: 15px; font-weight: 700; min-height: 44px; }
.picker button[aria-pressed="true"] { border-color: var(--white); background: var(--white); color: var(--panel); }
.ptabs { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; background: var(--panel2); padding: 5px; border-radius: 16px; }
.ptabs button { border: 0; background: transparent; border-radius: 12px; padding: 10px 4px; min-height: 58px; color: #E3E8F2; }
.ptabs button b { display: block; font-size: 18px; }
.ptabs button span { display: block; font-size: 12px; font-weight: 600; opacity: .8; margin-top: 2px; }
.ptabs button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.prac { display: flex; justify-content: space-between; align-items: center; gap: 14px; border-radius: 18px; padding: 18px 20px; background: var(--panel2); border: 2px solid transparent; width: 100%; text-align: left; color: var(--white); }
.prac.next { background: #1A2F63; }
.prac.done { border-color: var(--good); }
.prac .d { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.prac.next .d { color: var(--gold); }
.prac .w { font-size: 20px; font-weight: 800; margin-top: 3px; }
.prac .s { font-size: 15px; font-weight: 800; white-space: nowrap; }
.topic { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.topic .nm { font-size: 18px; font-weight: 700; flex: 1 1 220px; }
.conf { display: flex; gap: 6px; }
.conf button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 9px 13px; font-size: 14px; font-weight: 700; min-height: 44px; color: #E3E8F2; }
.conf button.on-yes { background: var(--good); border-color: var(--good); color: var(--panel); }
.conf button.on-kinda { background: var(--mid); border-color: var(--mid); color: var(--panel); }
.conf button.on-no { background: var(--white); border-color: var(--white); color: var(--panel); }
.drill { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 14px; align-items: center; }
.drill .num { width: 44px; height: 44px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800; }
.big { font-size: 42px; font-weight: 800; }

/* trophy case */
.board { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); background: #000; border: 2px solid var(--line); border-radius: 18px; padding: 16px 6px; text-align: center; }
.board div + div { border-left: 1px solid var(--line); }
.board b { display: block; font-size: 46px; line-height: 1; color: var(--gold); }
.board span { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--muted); }
.shelf { position: relative; border: 10px solid var(--white); border-bottom: 0; border-radius: 6px 6px 0 0; background-color: #0A1530;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.09) 0 1px, transparent 1px 22px), repeating-linear-gradient(-45deg, rgba(255,255,255,.09) 0 1px, transparent 1px 22px); padding: 20px 10px 0; }
.shelf-grass { height: 10px; background: #1E5A39; border-radius: 0 0 6px 6px; }
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; align-items: end; }
.award { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 12px; text-align: center; }
.award b { font-size: 20px; }
.award small { font-size: 12px; color: var(--muted); line-height: 1.25; }
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; }
.balls { display: flex; flex-wrap: wrap; gap: 8px; }
.empty { border: 2px dashed var(--line); border-radius: 16px; padding: 16px 18px; color: #E3E8F2; }

/* grades + schedule */
.cls { width: 100%; text-align: left; background: var(--panel); border: 0; border-radius: 16px; padding: 16px 18px; color: var(--white); display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.cls .g { font-size: 30px; font-weight: 800; }
.g-a { color: var(--good); } .g-b { color: var(--white); } .g-c { color: var(--mid); } .g-f { color: var(--bad); }
.cats { padding: 4px 18px 16px 64px; display: grid; gap: 8px; font-size: 15px; }
.cats .c { display: grid; grid-template-columns: minmax(0,1fr) 46px 52px; gap: 10px; }
.asg { display: grid; grid-template-columns: 70px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
.asg:first-child { border-top: 0; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; min-height: 42px; }
.filters button[aria-pressed="true"] { background: var(--white); color: var(--panel); border-color: var(--white); }
.msg { padding: 40px 10px; text-align: center; color: var(--muted); font-size: 18px; }

@media (max-width: 560px) {
  .top h1 { font-size: 30px; }
  .card .body { grid-template-columns: minmax(0,1fr) 104px; }
  .card .title { font-size: 26px; }
  .score b { font-size: 46px; }
  .buckets { grid-template-columns: 1fr; }
  .bucket { min-height: 0; }
  .cats { padding-left: 18px; }
}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="msg">Coach is getting your plan ready…</div></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>

  /* ---------- data model ---------- */
  function kindOf(a) {
    var n = low(a.name || a.title), t = low(a.type || a.kind);
    if (/review|practice|corrections?|check\b/.test(n) && !/\b(test|quiz)\b$/.test(n)) {

  function allAssignments() {
    var out = [];
    (D.classes || []).forEach(function (c) {

      }
      var hasRecord = state !== "next" && (wins.length + losses) > 0;
      var record = hasRecord ? '<div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:34px;font-weight:800;color:var(--good)">' + wins.length + ' W</span><span style="font-size:26px;font-weight:800;color:var(--dim)">\u2013</span><span style="font-size:34px;font-weight:800;color:var(--muted)">' + losses + ' L</span><span class="small">' + (state === "done" ? "Final record" : "Record so far") + '</span></div>' : '';
      if (state === "done") won += wins.length;
      var tag = state === "done" ? "FINAL" : state === "live" ? "IN PROGRESS · ENDS " + fmt(p.end).toUpperCase() : "STARTS " + fmt(p.start).toUpperCase();
      h += '<div class="panel stack" style="gap:12px"><div class="row"><div style="font-size:19px;font-weight:800">' + esc(p.name) + ' Tournament</div><span class="pill' + (state === "live" ? " gold" : "") + '">' + tag + '</span></div>' + record;
      if (state === "done") {
        h += wins.length ? '<div class="awards">' + wins.map(function (w) { return '<div class="award" style="padding-bottom:0">' + cup(60) + '<b>' + Math.round(w[1]) + '</b><small>' + esc(w[0]) + '</small></div>'; }).join("") + '</div>'
          : '<div class="small">' + (i === 0 ? "No 90s this round. Next tournament is a fresh start." : "Results show here once the period wraps up.") + '</div>';
      } else if (state === "live") {
        h += (wins.length ? '<div class="small" style="color:var(--good);font-weight:700">On track to win: ' + esc(wins.map(function (w) { return w[0] + " (" + Math.round(w[1]) + ")"; }).join(", ")) + '</div>' : '') +
          (close.length ? '<div class="small" style="color:var(--mid);font-weight:700">Within reach: ' + esc(close.map(function (w) { return w[0] + " (" + Math.round(w[1]) + ")"; }).join(", ")) + '</div>' : '') +
          (!wins.length && !close.length ? '<div class="small">Every class starts at zero wins. Get a class to 90 to put a trophy in play.</div>' : '');
      } else {
        h += '<div class="small">Coming up. Every class can win this one.</div>';
      }
      h += '</div>';
    });
    var semEnd = periods.length ? periods[periods.length - 1].end : null;
    var champs = graded.filter(function (c) { return c.gradePct != null && c.gradePct >= 90; });
    h += '<div class="panel row" style="justify-content:flex-start;gap:16px;background:#1A2F63">' + cup(56, true) + '<div class="stack" style="gap:4px"><div style="font-size:19px;font-weight:800">Semester Championship</div><div class="small">' +
      (semEnd && t > semEnd ? (champs.length ? "Champion in " + esc(champs.map(shortName).join(", ")) + "!" : "Season over. A new championship starts next semester.") :
        "Finish a class at 90+ by " + esc(semEnd ? fmt(semEnd, { month: "long", day: "numeric" }) : "the end of the semester") + ". " + (champs.length ? "On track in " + esc(champs.map(shortName).join(", ")) + "." : "Pick one class to make your title run.")) +
      '</div></div></div></div>';
    tournamentWins = won;
    return h;
  }
  var tournamentWins = 0;
  function viewGrades() {
    var m = D.meta || {};
    var h = '<div class="stack" style="gap:6px"><div class="eyebrow">My Stats</div><h1 style="font-size:34px;font-weight:800">Grades</h1><div class="sub">' + esc(m.currentPeriod || "") + ' · semester-to-date, from ParentVUE</div></div><div class="stack" style="gap:10px">';
    (D.classes || []).forEach(function (c) {
      if (!c.graded) return;
      var open = !!ui.open[c.period], up = c.firstProgressPct != null && c.gradePct != null ? c.gradePct - c.firstProgressPct : null;
      h += '<button class="cls" data-cls="' + c.period + '" aria-expanded="' + open + '"><span class="small" style="font-weight:800">P' + c.period + '</span><span><span style="display:block;font-size:18px;font-weight:700">' + esc(c.name) + '</span><span class="small">' + esc(c.teacher || "") + (up != null ? ' · ' + (up >= 0 ? "▲ " : "▼ ") + 'from ' + esc(c.firstProgress) : '') + '</span></span><span class="g g-' + band(c.gradePct) + '">' + esc(c.grade) + '</span></button>';
      if (open) {
        h += '<div class="panel cats">' + (c.categories || []).map(function (w) {
          return '<div class="c"><span>' + esc(w.type) + '</span><span class="small">' + (w.weight != null ? w.weight + "%" : "") + '</span><b class="g-' + (w.mark != null ? band(w.mark) : "b") + '">' + (w.mark != null ? Math.round(w.mark) : "–") + '</b></div>';
        }).join("") + (c.email ? '<div class="small">' + esc(c.email) + '</div>' : '') + '</div>';
      }
    });
    return h + '</div>';
  }

  function viewSchedule() {
    var t = today(), list = allAssignments().map(function (a) { return Object.assign({ k: kindOf(a) }, a); });
    var f = ui.filter;
    var shown = list.filter(function (a) {
      if (f === "upcoming") return a.due && a.due >= t;
      if (f === "games") return a.k === "test";
      if (f === "scrimmages") return a.k === "quiz";
      if (f === "waiting") return a.pct == null && a.status !== "nfg" && a.due && a.due < t;
      return true;
    }).sort(function (a, b) { return (b.due || "").localeCompare(a.due || ""); });
    var fl = [["all", "All"], ["upcoming", "Coming Up"], ["games", "Games"], ["scrimmages", "Scrimmages"], ["waiting", "Not Graded Yet"]];
    var h = '<div class="stack" style="gap:6px"><div class="eyebrow">Full Schedule</div><h1 style="font-size:34px;font-weight:800">Every Assignment</h1></div>';
    h += '<div class="filters">' + fl.map(function (x) { return '<button data-filter="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + x[1] + '</button>'; }).join("") + '</div>';
    h += '<div class="panel">' + (shown.length ? shown.map(function (a) {
      var right = a.pct != null ? '<b class="g-' + band(a.pct) + '">' + (Math.round(a.pct * 10) / 10) + '%</b>' : a.status === "nfg" ? '<span class="small">Not for grading</span>' : (a.due && a.due >= t ? '<span class="pill gold">COMING UP</span>' : '<span class="pill">NOT GRADED</span>');
      return '<div class="asg"><span class="small">' + esc(fmt(a.due)) + '</span><span><span style="display:block;font-weight:700">' + esc(a.name) + '</span><span class="small">' + esc(a.cls.name) + (a.k !== "work" ? " · " + (a.k === "test" ? "Game" : "Scrimmage") : "") + '</span></span>' + right + '</div>';
    }).join("") : '<div class="msg" style="padding:20px">Nothing here.</div>') + '</div>';
    return h;
  }

  function statusLine() {
    var m = D.meta || {};
    var when = m.syncedAt ? new Date(m.syncedAt).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : fmt(m.updated);
    return "Grades from ParentVUE, updated " + when + ". Due dates from ParentVUE and teacher posts in CTLS.";
  }

  var VIEWS = { home: ["Home", viewHome], plan: ["Coach", viewPlan], trophy: ["Trophies", viewTrophy], grades: ["Grades", viewGrades], schedule: ["Schedule", viewSchedule] };
  function renderTabs() {
    document.getElementById("tabs").innerHTML = Object.keys(VIEWS).map(function (k) {
      return '<button data-go="' + k + '"' + (ui.view === k ? ' aria-current="page"' : '') + '>' + navIcons[k] + VIEWS[k][0] + '</button>';
    }).join("");
  }
  function render() {
    renderTabs();
    var app = document.getElementById("app");
    if (!D) return;
    clipN = 0;
    app.innerHTML = VIEWS[ui.view][1]();
  }
  function go(view, ev) {
    ui.view = view;
    if (ev) { var e = events().filter(function (x) { return x.id === ev; })[0]; if (e) { ui.bucket = e.kind === "test" ? "game" : "scrimmage"; ui.ev = e.id; ui.tab = "when"; } }
    try { history.replaceState(null, "", "#" + view); } catch (e2) {}
    render(); window.scrollTo(0, 0);
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go],[data-bucket],[data-ev],[data-tab],[data-done],[data-conf],[data-cls],[data-filter]");
    if (!el) return;
    if (el.dataset.go) return go(el.dataset.go, el.dataset.ev);
    if (el.dataset.bucket) { ui.bucket = el.dataset.bucket; ui.ev = null; ui.tab = "when"; return render(); }
    if (el.dataset.ev) { ui.ev = el.dataset.ev; return render(); }
    if (el.dataset.tab) { ui.tab = el.dataset.tab; return render(); }
    if (el.dataset.done) { mine.done[el.dataset.done] = !mine.done[el.dataset.done]; saveMine(); return render(); }
    if (el.dataset.conf) { var k = el.dataset.conf; mine.conf[k] = mine.conf[k] === el.dataset.v ? "" : el.dataset.v; saveMine(); return render(); }
    if (el.dataset.cls) { ui.open[el.dataset.cls] = !ui.open[el.dataset.cls]; return render(); }
    if (el.dataset.filter) { ui.filter = el.dataset.filter; return render(); }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button][data-go]")) { e.preventDefault(); e.target.click(); }
  });

  /* ---------- live data ---------- */
  function takeSetupLink() {
    try {
      var p = new URLSearchParams(location.search), api = p.get("api");
      if (api && /^https:\/\/script\.google(usercontent)?\.com\//.test(api)) { store(API_KEY_URL, api); store(API_KEY_PASS, p.get("key") || ""); }
      if (p.has("api") || p.has("key")) history.replaceState(null, "", location.pathname + location.hash);
    } catch (e) {}
  }
  function apply(d) { D = { meta: d.meta || {}, ctls: d.ctls || null, classes: Array.isArray(d.classes) ? d.classes : [] }; render(); }
  var busy = false;
  function load() {
    var api = store(API_KEY_URL) || DEFAULT_API, key = store(API_KEY_PASS) || "";
    if (busy) return; busy = true;
    var url = api + (api.indexOf("?") >= 0 ? "&" : "?") + "view=ella" + (key ? "&key=" + encodeURIComponent(key) : "");
    fetch(url, { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || d.error || !Array.isArray(d.classes)) { if (!D) document.getElementById("app").innerHTML = '<div class="msg">Couldn\'t reach the family sheet. Trying again shortly.</div>'; return; }
      store(CACHE, JSON.stringify(d)); apply(d);
    }).catch(function () {
      if (!D) document.getElementById("app").innerHTML = '<div class="msg">You\'re offline and there\'s no saved copy yet.</div>';
    }).then(function () { busy = false; });
  }

  takeSetupLink();
  var h0 = (location.hash || "").replace("#", "");
  if (VIEWS[h0]) ui.view = h0;
  renderTabs();
  try { var cached = JSON.parse(store(CACHE) || "null"); if (cached && Array.isArray(cached.classes)) apply(cached); } catch (e) {}
  load();
  setInterval(load, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { load(); render(); } });
  window.addEventListener("online", load);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
